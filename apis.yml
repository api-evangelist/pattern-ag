aid: pattern-ag
name: Pattern Ag
description: 'Pattern Ag was a predictive-agronomy company founded in 2018 and headquartered
  in Emeryville, California, that applied DNA sequencing and soil metagenomics to
  forecast agronomic outcomes twelve months ahead of a growing season. Its Complete
  Bio and Pattern 360 products profiled the soil microbiome to predict pest, pathogen
  and nutrient-deficiency pressure, informing crop-protection, seed-selection and
  fertility decisions for corn and soybean growers, and in 2023 the company announced
  what it described as the world''s largest single-ecosystem metagenomics database.
  In August 2024 Pattern Ag merged with soil-sensing company EarthOptics; the combined
  business operates under the EarthOptics name and the Pattern Ag brand has been
  retired. As of this profile the pattern.ag website issues an HTTP 301 to
  www.earthoptics.com, every Pattern Ag deep link returns 404, and the Pattern Ag
  LinkedIn page redirects to an EarthOptics company page. Pattern Ag never published
  a public developer program, API documentation, SDKs or a machine-readable API
  contract under its own brand, and no Pattern Ag API surface survives. The successor
  company''s private REST API is profiled separately at all/earth-optics.'
